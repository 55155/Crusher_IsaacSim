<text x="298" y="252" font-size="15" font-weight="700" fill="#993C1D">10배 → 직경 0.46배</text>
<circle cx="550.2" cy="390.3" r="7" fill="#A32D2D"/>
<text x="540" y="360" text-anchor="end" font-size="15" font-weight="700" fill="#791F1F">381배 → 0.14배 (725 → 100 µm)</text>

<rect x="700" y="70" width="460" height="120" rx="8" fill="#FAECE7" stroke="#D85A30"/>
<text x="720" y="100" font-size="16" font-weight="700" fill="#712B13">예: 100알 → 1,000알</text>
<text x="720" y="128" font-size="14" fill="#993C1D">부피 ∝ d³ 이라 직경은 약 1/2 (0.46배) 만 준다</text>
<text x="720" y="152" font-size="14" fill="#993C1D">725 µm 에서 시작하면 풀을 다 써도 약 340 µm</text>
<text x="720" y="174" font-size="13" fill="#D85A30">파쇄 1~2단계밖에 표현 못 함</text>

<rect x="700" y="206" width="460" height="120" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="720" y="236" font-size="16" font-weight="700" fill="#501313">실제 시료: NaCl 2 g</text>
<text x="720" y="264" font-size="14" fill="#791F1F">725 µm 일 때 약 4,630알</text>
<text x="720" y="288" font-size="14" fill="#791F1F">체 한도 100 µm 까지 가면 약 176만 알 (381배)</text>
<text x="720" y="310" font-size="13" fill="#A32D2D">밀도 2,165 kg/m³ 기준 구 환산</text>

<rect x="700" y="342" width="460" height="110" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="720" y="372" font-size="16" font-weight="700" fill="#2C2C2A">현재 트윈의 규모</text>
<text x="720" y="400" font-size="14" fill="#444441">332–500알 · 기본 tol 96–117 ms/스텝</text>
<text x="720" y="424" font-size="14" fill="#444441">NEWTON_TOL 1e-4 에서 332 ms/스텝</text>
<text x="720" y="444" font-size="13" fill="#5F5E5A">+ d_hat 이 가장 작은 알에 묶여 크기 비도 비용</text>
</svg>
