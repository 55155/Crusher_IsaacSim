<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect width="1200" height="540" fill="#FFFFFF"/>

<rect x="120" y="80" width="312.5" height="360" fill="#FCEBEB"/>
<line x1="120" y1="440" x2="640" y2="440" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="120" y1="440" x2="120" y2="70" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
<text x="640" y="470" text-anchor="end" font-size="15" fill="#2C2C2A">두 표면 사이 틈 d</text>
<text x="132" y="66" font-size="15" fill="#2C2C2A">배리어 힘</text>
<line x1="432.5" y1="80" x2="432.5" y2="446" stroke="#A32D2D" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="432.5" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#A32D2D">d̂ (d_hat)</text>
<text x="120" y="466" text-anchor="middle" font-size="14" fill="#444441">0</text>
<text x="276" y="104" text-anchor="middle" font-size="14" fill="#791F1F">배리어 작동 구간 (d &lt; d̂)</text>
<text x="536" y="420" text-anchor="middle" font-size="14" fill="#5F5E5A">d ≥ d̂ : 힘 0</text>
<polyline fill="none" stroke="#A32D2D" stroke-width="3" points="145.0,100.0 149.9,154.1 154.7,194.2 159.6,225.2 164.5,250.0 169.4,270.4 174.2,287.5 179.1,302.1 184.0,314.7 188.9,325.7 193.7,335.5 198.6,344.1 203.5,351.9 208.3,358.9 213.2,365.2 218.1,371.0 223.0,376.3 227.8,381.1 232.7,385.6 237.6,389.7 242.5,393.5 247.3,397.0 252.2,400.3 257.1,403.3 261.9,406.1 266.8,408.8 271.7,411.2 276.6,413.5 281.4,415.6 286.3,417.6 291.2,419.5 296.1,421.3 300.9,422.9 305.8,424.4 310.7,425.8 315.6,427.2 320.4,428.4 325.3,429.6 330.2,430.6 335.0,431.6 339.9,432.6 344.8,433.4 349.7,434.2 354.5,435.0 359.4,435.6 364.3,436.2 369.2,436.8 374.0,437.3 378.9,437.8 383.8,438.2 388.6,438.5 393.5,438.9 398.4,439.1 403.3,439.4 408.1,439.6 413.0,439.7 417.9,439.8 422.8,439.9 427.6,440.0 432.5,440.0"/>
<line x1="432.5" y1="440" x2="620" y2="440" stroke="#A32D2D" stroke-width="3"/>
<circle cx="213.2" cy="365.2" r="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
<path d="M218 357 L250 250" fill="none" stroke="#2C2C2A" stroke-width="1.2" marker-start="url(#a)"/>
<text x="218" y="196" font-size="14" fill="#2C2C2A">변위 구동 → 틈이 여기 잠김</text>
<text x="218" y="216" font-size="14" fill="#2C2C2A">힘 = κ · b′(d)</text>
<text x="218" y="236" font-size="13" fill="#5F5E5A">κ = contact_resistance</text>

<rect x="700" y="60" width="460" height="130" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="720" y="90" font-size="16" font-weight="700" fill="#501313">실측 1 — 틈이 배리어에 잠긴다</text>
<text x="720" y="118" font-size="14" fill="#791F1F">최근접 간격 = 2R + d_hat (2.098–2.099 mm)</text>
<text x="720" y="142" font-size="14" fill="#791F1F">NEWTON_TOL 을 100배 조여도 한 자리도 안 움직임</text>
<text x="720" y="166" font-size="13" fill="#A32D2D">DigitalTwin.md §27-12, 7런 스윕</text>

<rect x="700" y="206" width="460" height="130" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="720" y="236" font-size="16" font-weight="700" fill="#412402">실측 2 — 계산은 정확, 값은 파라미터</text>
<text x="720" y="264" font-size="14" fill="#633806">알별 하중 443 mN (p95 2.8 N) = "수렴한 배리어력"</text>
<text x="720" y="288" font-size="14" fill="#633806">운동량 역산과 알별 비 1.00, cos +1.000</text>
<text x="720" y="312" font-size="13" fill="#854F0B">→ 값을 정하는 것은 물성이 아니라 d_hat · κ</text>

<rect x="700" y="352" width="460" height="120" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="720" y="382" font-size="16" font-weight="700" fill="#2C2C2A">결과 — 캘리브레이션이 필수</text>
<text x="720" y="410" font-size="14" fill="#444441">배리어는 비관통용 수치 장치이지 재료 법칙이 아님</text>
<text x="720" y="434" font-size="14" fill="#444441">로드셀 압축 곡선으로 κ 를 맞추고,</text>
<text x="720" y="456" font-size="14" fill="#444441">다른 장입량 1회로 검증해야 절대값을 쓸 수 있음</text>
</svg>
