<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#B5D4F4" stroke-width="1"/></pattern>
<pattern id="mp" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="#BA7517"/><circle cx="8" cy="8" r="2.2" fill="#BA7517"/></pattern>
</defs>
<rect width="1200" height="600" fill="#FFFFFF"/>

<text x="340" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2C2A">두께 방향 단면 (타격 구간)</text>
<rect x="130" y="100" width="440" height="330" fill="url(#grid)"/>
<rect x="230" y="250" width="340" height="180" fill="url(#mp)" opacity="0.9"/>
<rect x="130" y="100" width="440" height="330" fill="none" stroke="#185FA5" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="196" y="120" width="30" height="310" rx="3" fill="#444441"/>
<line x1="150" y1="470" x2="270" y2="470" stroke="#444441" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="210" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#2C2C2A">충돌판 (RBD, 크랭크 구동)</text>
<text x="210" y="520" text-anchor="middle" font-size="13" fill="#5F5E5A">= 봉투에서 유일하게 움직이는 면</text>
<text x="400" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#633806">파우더 = MPM 물질점</text>
<text x="400" y="80" text-anchor="middle" font-size="14" fill="#185FA5">격자 (dx = 0.5 mm) — 힘은 격자에서 계산</text>
<line x1="570" y1="265" x2="610" y2="265" stroke="#185FA5" stroke-width="1.4" marker-start="url(#a)"/>
<text x="616" y="260" font-size="14" font-weight="700" fill="#0C447C">도메인 경계</text>
<text x="616" y="280" font-size="13" fill="#185FA5">= 봉투 내면</text>
<text x="616" y="298" font-size="13" fill="#185FA5">(폭·높이 고정)</text>
<text x="350" y="560" text-anchor="middle" font-size="13" fill="#5F5E5A">IPC 런 실측: 타격 중 봉투 내면 폭 변동 0.3–0.7 % → 사실상 고정, 움직이는 건 두께 방향 한 면</text>

<g font-size="15">
<rect x="770" y="50" width="390" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="790" y="80" font-weight="700" fill="#412402">① MPM 격자법 — 과립재</text>
<text x="790" y="106" font-size="13" fill="#633806">알 개수와 무관, 비용 = 격자 해상도 · 물질점 수</text>

<rect x="770" y="144" width="390" height="98" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="790" y="174" font-weight="700" fill="#042C53">② Legacy 커플러 — 힘 계산</text>
<text x="790" y="200" font-size="13" fill="#0C447C">MPM ↔ Rigid: SDF 기반 격자 속도 보정</text>
<text x="790" y="222" font-size="13" fill="#0C447C">배리어(d_hat) 없음 · coup_restitution 0.8 (관통 0)</text>

<rect x="770" y="262" width="390" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="790" y="292" font-weight="700" fill="#04342C">출력</text>
<text x="790" y="318" font-size="13" fill="#085041">물질점별 응력 σ (저장한 F → 구성식)</text>
<text x="790" y="340" font-size="13" fill="#085041">판 · 벽 반력 → 스트로크 일 W (로드셀 비교)</text>
<text x="790" y="362" font-size="13" fill="#085041">압밀 Jp · 크랭크 토크</text>

<rect x="770" y="402" width="390" height="120" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="790" y="432" font-weight="700" fill="#501313">치르는 것</text>
<text x="790" y="458" font-size="13" fill="#791F1F">봉투는 엔티티가 아니라 경계조건 (FEM.Cloth 불가)</text>
<text x="790" y="480" font-size="13" fill="#791F1F">알별 힘사슬 → 셀 평균 응력으로 평활화</text>
<text x="790" y="502" font-size="13" fill="#791F1F">파쇄 · PSD 채널은 재료 확장 필요</text>
</g>
<line x1="965" y1="124" x2="965" y2="140" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="965" y1="242" x2="965" y2="258" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
