<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="660" fill="#FFFFFF"/>

<text x="40" y="44" font-size="17" font-weight="700" fill="#2C2C2A">① 상속 (Inheritance) — 설치 패키지는 한 줄도 안 고친다</text>

<rect x="40" y="66" width="480" height="150" rx="8" fill="#F1EFE8" stroke="#888780"/>
<rect x="40" y="66" width="480" height="40" rx="8" fill="#D3D1C7" stroke="#888780"/>
<text x="280" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#2C2C2A">IPCCoupler  (genesis, 원본)</text>
<g font-family="Consolas, monospace" font-size="14" fill="#444441">
<text x="60" y="132">_add_objects_to_ipc()      # Rigid, FEM 만 안다</text>
<text x="60" y="156">_register_contact_pairs()</text>
<text x="60" y="180">couple(f)                  # advance + retrieve</text>
<text x="60" y="204">_retrieve_fem_states()</text>
</g>

<line x1="280" y1="290" x2="280" y2="222" stroke="#534AB7" stroke-width="1.6" marker-end="url(#tri)"/>
<text x="296" y="262" font-size="13" fill="#534AB7">extends</text>

<rect x="40" y="290" width="480" height="232" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<rect x="40" y="290" width="480" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.4"/>
<text x="280" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#26215C">GrainIPCCoupler  (우리 코드)</text>
<g font-family="Consolas, monospace" font-size="14" fill="#3C3489">
<text x="60" y="358"><tspan font-weight="700">+ add_grains</tspan>(pos, radius, ρ)</text>
<text x="60" y="382"><tspan font-weight="700">+ hold_grains / release_grains</tspan>()</text>
<text x="60" y="412">↻ _add_objects_to_ipc():</text>
<text x="84" y="434">super() → <tspan font-weight="700">_add_grain_entities_to_ipc()</tspan></text>
<text x="60" y="462">↻ _register_contact_pairs():</text>
<text x="84" y="484">super() → 낟알×{천, 강체, 바닥, 낟알}</text>
<text x="60" y="510">↻ couple(f): super() → <tspan font-weight="700">_retrieve_grain_states()</tspan></text>
</g>
<text x="40" y="552" font-size="13" fill="#5F5E5A">＋ 새 메서드   ↻ 오버라이드 (원본 호출 후 확장)</text>

<text x="620" y="44" font-size="17" font-weight="700" fill="#2C2C2A">② 교체 주입 (Hot-swap) — 팩토리를 우회한다</text>
<g font-size="14">
<rect x="620" y="66" width="540" height="72" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="640" y="94" font-weight="700" fill="#501313">문제: Genesis 는 옵션 타입만 보고 IPCCoupler 를 직접 생성</text>
<text x="640" y="120" font-family="Consolas, monospace" font-size="13" fill="#791F1F">simulator.py:  isinstance(opts, IPCCouplerOptions) → IPCCoupler(...)</text>

<g fill="#2C2C2A">
<rect x="620" y="160" width="540" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="640" y="185" font-weight="700">1  scene = gs.Scene(coupler_options=IPCCouplerOptions(...))</text>
<text x="640" y="205" font-size="12" fill="#5F5E5A">Genesis 가 기본 IPCCoupler 를 만든다 (아직 build 전)</text>

<rect x="620" y="236" width="540" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="640" y="261" font-weight="700" fill="#26215C">2  scene._sim._coupler = GrainIPCCoupler(scene._sim, opts)</text>
<text x="640" y="281" font-size="12" fill="#534AB7">build() 전에 서브클래스 인스턴스로 바꿔치기 (의존성 주입)</text>

<rect x="620" y="312" width="540" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="640" y="337" font-weight="700">3  coupler.add_grains(positions, R, ρ)</text>
<text x="640" y="357" font-size="12" fill="#5F5E5A">Genesis 엔티티가 아니라 커플러가 직접 들고 있는 사양</text>

<rect x="620" y="388" width="540" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="640" y="413" font-weight="700">4  scene.build()</text>
<text x="640" y="433" font-size="12" fill="#5F5E5A">오버라이드된 _add_objects_to_ipc 가 호출됨</text>
</g>

<rect x="620" y="464" width="540" height="130" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="640" y="490" font-weight="700" fill="#04342C">5  uipc 쪽에서 실제로 일어나는 일</text>
<g font-family="Consolas, monospace" font-size="13" fill="#085041">
<text x="640" y="516">mesh = uipc.geometry.pointcloud(pos)   # dim()==0</text>
<text x="640" y="538">uipc.geometry.label_surface(mesh)      # 빠뜨리면 접촉 0</text>
<text x="640" y="560">Particle().apply_to(mesh, ρ, thickness=R)</text>
<text x="640" y="582">contact_tabular.insert(grain, cloth|rigid|grain)</text>
</g>
</g>
<line x1="890" y1="138" x2="890" y2="156" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="890" y1="216" x2="890" y2="232" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="890" y1="292" x2="890" y2="308" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="890" y1="368" x2="890" y2="384" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="890" y1="444" x2="890" y2="460" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M524 264 L570 264 L570 264 L616 264" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="630" font-size="13" fill="#5F5E5A">함정 2건 (코드로 확정): label_surface 누락 → 낟알이 바닥을 통과 / 낟알은 debug 마커라 camera(debug=True) 아니면 렌더에서 빠짐</text>
</svg>
